name: video2text-nas

x-worker: &worker
  build:
    context: ../..
    dockerfile: deploy/nas/Dockerfile
  env_file:
    - .env
  environment:
    VIDEO2TEXT_DATA_ROOT: /data
    VIDEO2TEXT_CONFIG_DIR: /config
  volumes:
    - type: bind
      source: ${VIDEO2TEXT_DATA_DIR:-/srv/app-data/video2text}
      target: /data
    - type: bind
      source: ${VIDEO2TEXT_CONFIG_DIR:-/srv/video2text-config}
      target: /config
      read_only: true
  networks:
    - edge
    - egress
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    # Public STT/upload edge only. Sub2API auditing runs in its own Compose project.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    # Cap the docker json-file driver. Unbounded container logs grow without limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      VIDEO2TEXT_PUBLIC_HOST: ${VIDEO2TEXT_PUBLIC_HOST:?Set VIDEO2TEXT_PUBLIC_HOST in .env}
      VIDEO2TEXT_WEB_HOST: ${VIDEO2TEXT_WEB_HOST:?Set VIDEO2TEXT_WEB_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/web/public:/srv/video2text-web:ro
      - caddy_data:/data
      - public_edge_config:/config
    depends_on:
      - tusd
      - worker
      - cantones
    # Keep the existing memory ceiling and log rotation on the official edge.
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - edge
      - egress
    security_opt:
      - no-new-privileges:true

  tusd:
    image: tusproject/tusd:v2.9.2
    user: "1000:1000"
    restart: unless-stopped
    command:
      - -upload-dir=/srv/tusd-data
      - -base-path=/files/
      - -behind-proxy
      - -disable-download
      - -disable-termination
      - -disable-concatenation
      - -max-size=${VIDEO2TEXT_MAX_UPLOAD_BYTES:-5368709120}
      - -cors-allow-origin=${VIDEO2TEXT_WEB_ORIGIN_REGEX:-https://stt\.151077\.xyz}
      - -cors-allow-headers=X-Upload-Token
      - -cors-max-age=3600
      - -hooks-http=http://worker:8080/hooks/tusd
      - -hooks-http-forward-headers=X-Upload-Token
      - -hooks-http-retry=5
      - -hooks-http-backoff=2s
      - -hooks-enabled-events=pre-create,post-receive,post-finish
      - -progress-hooks-interval=60s
      - -log-format=json
    volumes:
      - type: bind
        source: ${VIDEO2TEXT_DATA_DIR:-/srv/app-data/video2text}/uploads
        target: /srv/tusd-data
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    <<: *worker

  cantones:
    build:
      context: ../../apps/cantonese-demo
      dockerfile: ../../deploy/nas/Dockerfile.cantones
    env_file:
      - .env
    environment:
      VIDEO2TEXT_CONFIG_DIR: /config
      DEMO_PORT: 4178
      CANTONES_BIND: 0.0.0.0
      CANTONES_ONLY: 1
      # Container paths override accidental host/Windows values in env_file.
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CANTONES_PUBLIC_ORIGIN: https://${VIDEO2TEXT_WEB_HOST}
    volumes:
      - type: bind
        source: ${VIDEO2TEXT_DATA_DIR:?Set VIDEO2TEXT_DATA_DIR in .env}/cantones
        target: /app/apps/cantonese-demo/.data
      - type: bind
        source: ${VIDEO2TEXT_CONFIG_DIR:-/srv/video2text-config}
        target: /config
        read_only: true
    networks:
      - edge
      - egress
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cleanup:
    <<: *worker
    command: ["python", "-m", "apps.nas_worker.cleanup"]
    restart: "no"
    profiles:
      - maintenance

volumes:
  # Existing TLS storage remains owned by the public edge.
  caddy_data:
  # Separate config storage; the legacy config volume contains audit spool files.
  public_edge_config:
  # Preserve the legacy audit volume outside this project's deletion lifecycle.
  caddy_config:
    external: true
    name: video2text-nas_caddy_config

networks:
  edge:
    internal: true
  egress:
